            # What is a Ractor

            Note:
            - Let's start with the basics
            ---
            ## What is a Ractor

            - **R**uby **Actor**
            - Introduced in Ruby 3.0 (2020)
            - Designed by Koichi Sasada
            - Still experimental in Ruby 4.0

            Note:
            - A Ractor is short for Ruby Actor
            - An impl of the actor model pattern in Ruby
            - Ractors are isolated units of execution
            - that talk to each other with messages
            - and share immutable data
            ---
            ## What is a Ractor

            - **R**uby **Actor**
            - Introduced in Ruby 3.0 (2020)
            - Designed by Koichi Sasada
            - Still experimental in Ruby 4.0

            Note:
            - They were made by Koichi Sasada
            - of the Ruby Core team
            - and they've been in Ruby for awhile now
            - Since 2020
            - And are still marked as experimental
            ---
            ## Ractors on other Ruby platforms

            | Implementation | Ractors | Parallel Threads |
            | -------------- | ------- | ---------------- |
            | CRuby (MRI)    | Native  | No               |
            | JRuby          | No      | Yes              |
            | TruffleRuby    | No      | Yes              |

            Note:
            - Ractors are currently a CRuby feature
            - JRuby and TruffleRuby do not implement them
            - They already run normal Ruby threads in parallel
            - So Ractor support isn't as necessary

            ## What is a Ractor

            ```rb[]
            ractor = Ractor.new { 20 * 2 }

            ractor.join.value # => 40
            ```

            Note:
            - This is what a Ractor looks like
            - Ractor.new takes a block
            - And runs the code
            ---
            ## What is a Ractor

            ```rb[1]
            ractor = Ractor.new { 20 * 2 }

            ractor.join.value # => 40
            ```

            Note:
            - In this case simple multiplication
            - In a new Ractor
            - With its own Global VM lock
            - (GVL for short)
            - Running in parallel
            ---
            ## What is a Ractor

            ```rb[3]
            ractor = Ractor.new { 20 * 2 }

            ractor.join.value # => 40
            ```

            Note:
            - Calling value waits for
            - the Ractor to finish
            - And hands us back the result
            ---
            ## What is a Ractor

            ```rb[]
            thread = Thread.new { 20 * 2 }

            thread.join.value # => 40
            ```

            Note:
            - You can actually use
            - The exact same APIs
            - With threads in Ruby
            - We'll talk more about threads later
            ---
            ## What is a Ractor

            ```rb[]
            a = 1

            Ractor.new { puts a }
            # ArgumentError: can not isolate a Proc
            #   because it accesses outer variables (a).
            ```

            Note:
            - For now
            - Here's where ractors differ from threads
            - The passed block is isolated
            - It can't see outer scoped variables
            - Ruby raises when you try to use them
            ---
            ## What is a Ractor

            ```rb[]
            a = 1

            Ractor.new(a) { |a| puts a }.join
            # 1
            ```

            Note:
            - If you want to use something from an outer scope
            - You can pass it in explicitly
            - Arguments of Ractor.new become block arguments
            - And may be referenced at that point
            ---
            ## What is a Ractor

            ```rb[]
            ractor = Ractor.new do
              message = Ractor.receive
              "#{message} world"
            end

            ractor.send("hello")
            ractor.value # => "hello world"
            ```

            Note:
            - Ractors can also pass messages
            - Via the port API
            - Every Ractor has a mailbox
            - Which can be used to do this exchange
            ---
            ## What is a Ractor

            ```rb[6]
            ractor = Ractor.new do
              message = Ractor.receive
              "#{message} world"
            end

            ractor.send("hello")
            ractor.value # => "hello world"
            ```

            Note:
            - Send puts a message in the box
            - In this case, a hello string
            ---
            ## What is a Ractor

            ```rb[2]
            ractor = Ractor.new do
              message = Ractor.receive
              "#{message} world"
            end

            ractor.send("hello")
            ractor.value # => "hello world"
            ```

            Note:
            - Receive blocks until something is sent
            - So this Ractor won't fully run
            - Until the hello string is sent
            ---
            ## What is a Ractor

            ```rb[3,7]
            ractor = Ractor.new do
              message = Ractor.receive
              "#{message} world"
            end

            ractor.send("hello")
            ractor.value # => "hello world"
            ```

            Note:
            - And when it is
            - The value is interpolated
            - We get the result back
            - And can use it how we want
            ---
            ## What is a Ractor

            ```rb[]
            port = Ractor::Port.new

            ractor = Ractor.new(port) do |port|
              port.send(:start)
              Ractor.receive
            end

            port.receive # => :start
            ractor.send(:end)
            ractor.value # => :end
            ```

            Note:
            - Mailboxes can also be made separately
            - Via the Port class
            - Anyone can send to a port
            - Only the owning Ractor can receive from it
            ---
            ## What is a Ractor

            ```rb[]
            port = Ractor::Port.new

            ractor = Ractor.new(port) do |port|
              port.send(:start)
              Ractor.receive
            end

            port.receive # => :start
            ractor.send(:end)
            ractor.value # => :end
            ```

            Note:
            - Here the Ractor tells us
            - when it's ready to start
            - And we tell it when to end
            - Through sending and receiving symbols
            - *Pause*

            ## What is a Ractor

            ```rb[]
            Ractor.shareable?(1)                   # => true
            Ractor.shareable?(:symbol)             # => true
            Ractor.shareable?(String)              # => true

            Ractor.shareable?("foo")               # => false
            Ractor.shareable?("foo".freeze)        # => true

            Ractor.shareable?([Object.new].freeze) # => false
            ```

            Note:
            - The most important concept in Ractors
            - Is shareability
            - Numbers, symbols, and modules are shareable
            ---
            ## What is a Ractor

            ```rb[]
            Ractor.shareable?(1)                   # => true
            Ractor.shareable?(:symbol)             # => true
            Ractor.shareable?(String)              # => true

            Ractor.shareable?("foo")               # => false
            Ractor.shareable?("foo".freeze)        # => true

            Ractor.shareable?([Object.new].freeze) # => false
            ```

            Note:
            - A string is not, unless frozen
            - A frozen array holding a mutable object is not
            - Shareable basically means deeply frozen
            - And you can use shareable? to check
            ---
            ## What is a Ractor

            ```rb[]
            config = { hosts: ["a.example", "b.example"] }
            Ractor.shareable?(config)   # => false

            Ractor.make_shareable(config)

            config.frozen?              # => true
            config[:hosts].frozen?      # => true
            config[:hosts][0].frozen?   # => true
            ```

            Note:
            - Ractor.make_shareable walks an object graph
            - Of an object you give it
            - And freezes everything in it
            - Or it raises an IsolationError if it can't
            ---
            ## What is a Ractor

            ```rb[9-11]
            config = { hosts: ["a.example", "b.example"] }
            Ractor.shareable?(config)   # => false

            Ractor.make_shareable(config)

            config.frozen?              # => true
            config[:hosts].frozen?      # => true
            config[:hosts][0].frozen?   # => true
            ```

            Note:
            - In this case, the config hash
            - and the nested array
            - Including each nested string
            ---
            ## What is a Ractor

            ```rb[]
            receiver = Ractor.new { Ractor.receive }
            data = ["foo", "bar"]

            receiver.send(data)
            # copied: a deep clone of the unshareable parts
            receiver.value

            receiver = Ractor.new { Ractor.receive }
            receiver.send(data, move: true)
            # moved: `data` is now a Ractor::MovedObject
            receiver.value
            ```

            Note:
            - You can send a Ractor unshareable data
            - Ruby will copy it for you automatically
            - But you can move it via move: true
            - The receiver Ractor gets the original
            - And the sender loses access to it
            ---
            ## What is a Ractor

            ```rb[]
            GOOD = "good".freeze
            BAD  = +"bad"

            Ractor.new { GOOD }.value
            # => "good"

            Ractor.new { BAD }.value
            # Ractor::RemoteError: thrown by remote Ractor.
            #   cause: Ractor::IsolationError: can not access non-shareable objects
            #   in constant Object::BAD by non-main Ractor
            ```

            Note:
            - Constants follow the same rules
            - A Ractor can read a constant
            - Only if its value is shareable
            - Otherwise you get an IsolationError
            - Telling you about the non-shareable object
            ---
            ## What is a Ractor

            ```rb[]
            class Settings
              class << self
                attr_accessor :value
              end
            end

            Settings.value = +"x"

            Ractor.new { Settings.value }.value
            # Ractor::RemoteError: thrown by remote Ractor.
            #   cause: Ractor::IsolationError: can not get unshareable values from
            #   instance variables of classes/modules from non-main Ractors
            #   (@value from Settings)
            ```

            Note:
            - Class level ivars are the same
            - Classes are shareable
            - But their ivars might not be
            ---
            ## What is a Ractor

            ```rb[9-13]
            class Settings
              class << self
                attr_accessor :value
              end
            end

            Settings.value = +"x"

            Ractor.new { Settings.value }.value
            # Ractor::RemoteError: thrown by remote Ractor.
            #   cause: Ractor::IsolationError: can not get unshareable values from
            #   instance variables of classes/modules from non-main Ractors
            #   (@value from Settings)
            ```

            Note:
            - So in this case
            - Referencing Settings in a Ractor fails
            - Because the value ivar is mutable
            - It is a mutable string
            ---
            ## What is a Ractor

            ```rb[]
            Ractor[:cache] = {}
            Ractor[:cache] # => {}

            Ractor.store_if_absent(:cache) { {} }
            ```

            Note:
            - Like threads, Ractors also have storage
            - Subscript syntax can be used like a hash
            - While store_if_absent initializes a value once atomically
            - Which is useful for per-Ractor caches
            ---
            ## What is a Ractor

            ```rb[]
            handler = Ractor.shareable_proc do |env|
              [200, {}, ["ok"]]
            end
            Ractor.shareable?(handler) # => true

            prefix = +"Draft: "
            Ractor.shareable_proc { prefix }
            # Ractor::IsolationError: cannot make a shareable Proc because it can
            #   refer unshareable object "Draft: " from variable 'prefix'
            ```

            Note:
            - There's also shareable procs and lambdas
            - A regular proc isn't shareable
            - It captures self and locals
            - The shareable_proc method returns an isolated, shareable copy
            - And raises if referenced variables are unshareable
            ---
            ## What is a Ractor

            ```rb[]
            Ractor.main? # => true

            ractor = Ractor.new { Ractor.main? }
            ractor.value # => false
            ```

            Note:
            - I hinted at it, but
            - You're actually using Ractors today
            - And might not even know it
            - If you're running Ruby 3 or later
            - A Ruby process starts in a "main" Ractor
            ---
            ## What is a Ractor

            ```rb[]
            $requests = 0
            $requests += 1 # allowed in the main Ractor

            worker = Ractor.new { $requests += 1 }
            Ractor.select(worker)
            # Ractor::RemoteError: thrown by remote Ractor.
            #   cause: Ractor::IsolationError: can not access global variable
            #   $requests from non-main Ractor
            ```

            Note:
            - And calling Ractor.new creates a non-main Ractor
            - These Ractors can't read or write global variables
            - The main Ractor can and will
            ---
            ## What is a Ractor

            - Shareable objects cross Ractor boundaries
            - Shareable means deeply frozen
            - Unshareable objects can be copied or moved
            - No unshareable constants or classes

            Note:
            - So, the rules of Ractors are:
            - Only shareable objects cross Ractor boundaries
            - Shareable means deeply frozen
            - Unshareable objects can be copied or moved
            - And Ractors can't touch unshareable constants
            - *Pause*

            # Ractors vs Threads

            Note:
            - Now let's talk about why this is useful
            - By comparing it to threads and processes
            - Which was our only options before Ractors
            ---
            ## Ractors vs Threads

            ```mermaid
            flowchart TD
                Process --> GVL
                GVL --> T1[Thread 1]
                GVL --> T2[Thread 2]
                GVL --> T3[Thread 3]
            ```

            Note:
            - This is a Ruby process with threads
            - Every thread shares the Global VM Lock
            - And so, only 1 thread executes Ruby at a time
            - At least in CRuby
            ---
            ## Ractors vs Threads


            ```mermaid
            flowchart TD
                Process --> GVL
                GVL --> T1[Thread 1]
                GVL --> T2[Thread 2]
                GVL --> T3[Thread 3]
            ```

            Note:
            - Threads give you concurrency
            - Which is great for waiting on IO
            - But for CPU bound work
            - Threads take turns
            - Because the GVL allows only one thread
            - To execute Ruby at a time
            ---
            ## Ractors vs Threads

            ```mermaid
            flowchart TD
                Process --> GVL
                GVL --> T1[Thread 1]
                GVL --> T2[Thread 2]
                GVL --> T3[Thread 3]
            ```

            Note:
            - In a threaded web server
            - If one request is rendering a view
            - The others wait for the GVL
            - And server latency goes up
            ---
            ## Ractors vs Threads

            ```mermaid
            flowchart TD
                Puma --> W1[Worker 1]
                Puma --> W2[Worker 2]
                W1 --> G1[GVL] --> T1[Threads]
                W2 --> G2[GVL] --> T2[Threads]
            ```

            Note:
            - Until now
            - The workaround was forking
            - Puma can fork workers into separate processes
            - Each with its own memory and GVL
            - With multiple processes, requests can run in parallel
            ---
            ## Ractors vs Threads

            ```mermaid
            flowchart TD
                Puma --> W1[Worker 1]
                Puma --> W2[Worker 2]
                W1 --> G1[GVL] --> T1[Threads]
                W2 --> G2[GVL] --> T2[Threads]
            ```

            Note:
            - But every fork has a copy of your app
            - Preloading helps with copy-on-write
            - Workers start out sharing pages
            - But as they run, memory diverges
            - And overall footprint grows with each worker
            ---
            ## Ractors vs Threads

            ```mermaid
            flowchart TD
                Process --> R1[Ractor 1] --> G1[GVL] --> T1[Threads]
                Process --> R2[Ractor 2] --> G2[GVL] --> T2[Threads]
                Process --> R3[Ractor 3] --> G3[GVL] --> T3[Threads]
            ```

            Note:
            - Ractors are different
            - One process
            - But each Ractor has its own GVL
            - So they run Ruby in parallel
            - And share anything that's immutable
            - Or copy it
            ---

            ---
            ## Ractors vs Threads

            |                | Process  | Thread     | Ractor         |
            | -------------- | -------- | ---------- | -------------- |
            | Parallel Ruby | Yes | No       | Yes            |
            | Shares memory  | Copy-on-write | Everything | Shareable objects |
            | Data races     | Impossible | Possible | Impossible     |
            | Communication  | IPC      | Shared objects | Messages   |

            Note:
            - To sum it up
            - Processes are parallel, but expensive in terms of memory
            - Threads are cheap, but serialized for CPU-bound work
            - Ractors are parallel, but often require code changes

            ## Ractors on Rails

            ```sh
            rails new ractor_app \
              --template https://tinyurl.com/ractor-template \

            ## Ractors on Rails

            ```rb[]
            module ActiveSupport
              module Ractors
                class << self
                  def shareable?(obj)        = Ractor.shareable?(obj)
                  def make_shareable(...)    = Ractor.make_shareable(...)
                  def shareable_proc(...)    = Ractor.shareable_proc(...)
                  def shareable_lambda(...)  = Ractor.shareable_lambda(...)
                  def main?                  = Ractor.main?
                end
              end
            end
            ```

            Note:
            - The first was determining support
            - Ruby 4 had the APIs we wanted
            - And Rails still supported Ruby 3
            - Which doesn't have usable Ractor APIs
            ---
            ## Ractors on Rails

            ```rb[]
            module ActiveSupport
              module Ractors
                class << self
                  def shareable?(obj)        = Ractor.shareable?(obj)
                  def make_shareable(...)    = Ractor.make_shareable(...)
                  def shareable_proc(...)    = Ractor.shareable_proc(...)
                  def shareable_lambda(...)  = Ractor.shareable_lambda(...)
                  def main?                  = Ractor.main?
                end
              end
            end
            ```

            Note:
            - This is where ActiveSupport::Ractors comes in
            - Thin shims over the Ractor API
            - On Ruby 4, they delegate to real Ractor APIs
            - On older Rubies, it shims the behaviour
            - This was a lot better than putting IFs everywhere

            ## Ractors on Rails

            ```rb[]
            @list = {
              long_ordinal: lambda { |time|
                day_format = ActiveSupport::Inflector.ordinalize(time.day)
                time.strftime("%B #{day_format}, %Y %H:%M")
              },
              rfc822: lambda { |time|
                offset_format = time.formatted_offset(false)
                time.strftime("%a, %d %b %Y %H:%M:%S #{offset_format}")
              },
              rfc2822: lambda { |time| time.rfc2822 },
              iso8601: lambda { |time| time.iso8601 },
            }.freeze
            ```

            Note:
            - Here's an example
            - `ActiveSupport::TimeFormats` keeps
            - formatter lambdas in a hash
            - Freezing the list hash is not enough:
            ---
            ## Ractors on Rails

            ```rb[]
            @list = {
              long_ordinal: ActiveSupport::Ractors.shareable_lambda { |time|
                day_format = ActiveSupport::Inflector.ordinalize(time.day)
                time.strftime("%B #{day_format}, %Y %H:%M")
              },
              rfc822: ActiveSupport::Ractors.shareable_lambda { |time|
                offset_format = time.formatted_offset(false)
                time.strftime("%a, %d %b %Y %H:%M:%S #{offset_format}")
              },
              rfc2822: ActiveSupport::Ractors.shareable_lambda { |time| time.rfc2822 },
              iso8601: ActiveSupport::Ractors.shareable_lambda { |time| time.iso8601 },
            }.freeze
            ```

            Note:
            - The lambdas must be made shareable
            - We can simply use ActiveSupport::Ractors
            - to add Ractor support on Ruby 4
            - And to no-op on older Rubies

            ```rb[]
            def ractorize!
              env_config
              revision
              routes

              @autoloaders, @reloaders, @routes_reloader = nil, nil, nil

              ActiveSupport.run_load_hooks(:before_ractorize, self)
              ActiveSupport::TimeZone.make_shareable!

              Ractor.make_shareable(self)

              require "rack/ractorize"
            end

            Note:

            ## Ractors on Rails

            ```rb[2-4]

            Note:
            - First, it forces lazy values to compute

            - In order to freeze the app
            - Nothing can be lazily assigned
            - So memoized values need to be calculated

            ## Ractors on Rails

            ```rb[]
            # config/environments/production.rb

            config.eager_load = true
            config.logger = ActiveSupport::Ractors::Logger.new
            config.cache_store = :null_store
            config.action_cable.mount_path = nil
            config.active_job.queue_adapter = :inline

            ## Conclusion

            ```rb[]
            ractor = Ractor.new { 21 * 2 }

            ractor.value # => 42
            ```

            Note:
            - Ractors are isolated units of execution
            - That communicate with messages
            - And only share copied or deeply frozen objects
            ---
            ## Conclusion

            ```mermaid
            flowchart TD
                Process --> R1[Ractor 1] --> G1[GVL] --> T1[Threads]
                Process --> R2[Ractor 2] --> G2[GVL] --> T2[Threads]
                Process --> R3[Ractor 3] --> G3[GVL] --> T3[Threads]
            ```

            Note:
            - Each Ractor has its own GVL
            - So unlike threads, they run Ruby in parallel
            - And unlike forking, they do it in one process
